[workspace]
resolver = "2"
# cargo-fuzz builds this crate on its own, with sanitizer flags the workspace
# must not inherit, so it is not a member.
exclude = ["fuzz"]
members = [
    "crates/darwin-core",
    "crates/darwin-cli",
    "crates/darwin-bench",
    "bindings/python",
    "bindings/node",
    "bindings/wasm",
    "bindings/c",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wickra-lib/wickra-darwin"
authors = ["wickra-lib"]

[workspace.dependencies]
# Workspace-internal core, referenced by the CLI, bench and bindings.
wickra-darwin-core = { version = "0.1.0", path = "crates/darwin-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1"
clap = { version = "4", features = ["derive"] }
# Held at the same major as the copy `wickra-backtest` resolves, so the tree
# carries one `wickra-core` and one set of indicator types rather than two that
# share none at all.
wickra-core = "1.0"
# The compute engine DARWIN calls once per candidate, and the ecosystem's only
# name -> indicator registry: what lets the search space name any indicator
# rather than the four this repository used to hardcode.
wickra-backtest = "0.1.4"
cbindgen = "0.27"
criterion = { package = "codspeed-criterion-compat", version = "5.0.1", features = ["html_reports"] }
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
